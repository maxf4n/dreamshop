<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crypto Payment — DreamShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/pay.css" />
</head>
<body>
  <header class="pay-header">
    <a href="/" class="brand">DreamShop</a>
    <div class="order-meta">
      <span class="order-id">Order #<span id="orderId">—</span></span>
      <span class="order-total" id="orderTotal">$0.00</span>
    </div>
  </header>

  <main class="pay-main">
    <section id="loading" class="loading">Loading…</section>

    <section id="errorBox" class="error-box hidden">
      <h2>Could not load payment</h2>
      <p id="errorText" class="muted"></p>
      <a href="/" class="btn btn-outline">Back to Home</a>
    </section>

    <section id="payScreen" class="pay-grid hidden">
      <div class="pay-col-left">
        <h3>Choose a currency and network</h3>

        <div class="coin-tabs" id="coinTabs"></div>

        <div class="networks" id="networkList"></div>

        <div class="pay-summary">
          <div class="row">
            <span class="muted">Order total</span>
            <span id="sumFiat">$0.00</span>
          </div>
          <div class="row" id="rowRate" hidden>
            <span class="muted">Rate</span>
            <span id="sumRate">—</span>
          </div>
          <div class="row total">
            <span>Amount due</span>
            <span id="sumCrypto">—</span>
          </div>
        </div>
      </div>

      <div class="pay-col-right">
        <div class="pay-card">
          <div class="pay-coin-badge" id="coinBadge">
            <span class="coin-symbol" id="badgeSymbol">—</span>
            <span class="coin-net" id="badgeNetwork">—</span>
          </div>

          <div class="field">
            <div class="field-label">
              <span>Payment address</span>
              <button class="copy-btn" data-copy="address" type="button">Copy</button>
            </div>
            <div class="field-value mono" id="addressValue">—</div>
          </div>

          <div class="field">
            <div class="field-label">
              <span>Amount to send</span>
              <button class="copy-btn" data-copy="amount" type="button">Copy</button>
            </div>
            <div class="field-value mono" id="amountValue">—</div>
          </div>

          <div class="qr-wrap">
            <img id="qrImage" alt="Payment QR code" />
          </div>

          <p class="net-note muted small" id="netNote"></p>

          <div class="timer">
            <span class="timer-label">Time left</span>
            <span class="timer-value" id="timerValue">30:00</span>
          </div>

          <button class="btn btn-primary" id="btnPaid" type="button" disabled>
            I have paid
          </button>
          <p class="muted small center" id="paidHint">
            Select a currency and network to proceed.
          </p>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/pay.js?v=2"></script>
</body>
</html>
