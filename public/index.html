<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DreamShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <!-- Splash -->
  <div id="splash" class="splash">
    <div class="splash-title">DREAMSHOP</div>
  </div>

  <!-- App -->
  <div id="app" class="app hidden">
    <header class="header">
      <div class="brand" id="brand">DreamShop</div>
      <div class="header-actions">
        <button id="btnCart" class="btn btn-ghost" type="button">
          Cart <span id="cartCount" class="badge">0</span>
        </button>
        <button id="btnProfile" class="btn btn-ghost hidden" type="button">Profile</button>
        <button id="btnLogin" class="btn btn-primary" type="button">Sign In</button>
      </div>
    </header>

    <main class="main">
      <section class="selector">
        <div class="field">
          <label for="cityInput">City</label>
          <div class="combo" id="cityCombo">
            <input
              type="text"
              id="cityInput"
              placeholder="Start typing the city name"
              autocomplete="off"
            />
            <div class="combo-list hidden" id="cityList"></div>
          </div>
        </div>
        <div class="field">
          <label for="districtInput">District</label>
          <div class="combo" id="districtCombo">
            <input
              type="text"
              id="districtInput"
              placeholder="Select a city first"
              autocomplete="off"
              disabled
            />
            <div class="combo-list hidden" id="districtList"></div>
          </div>
        </div>
      </section>

      <section id="productsSection" class="products hidden">
        <h2 class="section-title">Products</h2>
        <ul id="productList" class="product-list"></ul>
      </section>

      <section id="emptyState" class="empty">
        <p>Select a city and district to see products.</p>
      </section>
    </main>
  </div>

  <!-- Product modal -->
  <div id="productModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card">
      <button class="modal-close" data-close type="button">×</button>
      <h3 id="pmTitle"></h3>
      <p id="pmDesc" class="muted"></p>
      <p class="pm-price">
        Price: <b id="pmPrice">$0.00</b> <span class="muted">/ g</span>
      </p>
      <p class="muted small" id="pmMin"></p>
      <label for="pmQty">Quantity (g)</label>
      <input type="number" id="pmQty" step="0.1" min="0.1" inputmode="decimal" />
      <p class="total">
        Total: <b id="pmTotal">$0.00</b>
      </p>
      <button class="btn btn-primary" id="pmAdd" type="button">Add to Cart</button>
    </div>
  </div>

  <!-- Cart modal -->
  <div id="cartModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card wide">
      <button class="modal-close" data-close type="button">×</button>
      <h3>Cart</h3>
      <div id="cartItems" class="cart-items"></div>
      <p id="cartEmpty" class="muted hidden">Your cart is empty.</p>
      <p class="total">
        Total: <b id="cartTotal">$0.00</b>
      </p>
      <button class="btn btn-primary" id="cartCheckout" type="button">Checkout</button>
    </div>
  </div>

  <!-- Auth modal -->
  <div id="authModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card">
      <button class="modal-close" data-close type="button">×</button>
      <div class="tabs">
        <button class="tab active" data-tab="login" type="button">Sign In</button>
        <button class="tab" data-tab="register" type="button">Sign Up</button>
      </div>
      <form id="authForm" novalidate>
        <label for="authUsername">Username</label>
        <input
          type="text"
          id="authUsername"
          autocomplete="username"
          minlength="3"
          maxlength="32"
          required
        />
        <label for="authPassword">Password</label>
        <input
          type="password"
          id="authPassword"
          autocomplete="current-password"
          minlength="6"
          maxlength="100"
          required
        />
        <p id="authError" class="error hidden"></p>
        <button type="submit" class="btn btn-primary" id="authSubmit">Sign In</button>
      </form>
    </div>
  </div>

  <!-- Pay modal -->
  <div id="payModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card">
      <button class="modal-close" data-close type="button">×</button>
      <h3>Order #<span id="payOrderId"></span> placed</h3>
      <p>
        Amount: <b id="payAmount">$0.00</b>
      </p>
      <p class="muted">Choose a payment method:</p>
      <div class="pay-options">
        <button class="btn btn-outline" id="payTelegram" type="button">
          Contact manager on Telegram
        </button>
        <button class="btn btn-primary" id="payCrypto" type="button">
          Pay with Cryptocurrency
        </button>
      </div>
      <div id="payInfo" class="pay-info hidden"></div>
    </div>
  </div>

  <!-- Profile modal -->
  <div id="profileModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card wide">
      <button class="modal-close" data-close type="button">×</button>
      <div class="profile-header">
        <h3>Profile</h3>
        <button class="btn btn-outline" id="btnLogout" type="button">Sign Out</button>
      </div>
      <p>
        User: <b id="profileUsername">—</b>
      </p>
      <h4>My Orders</h4>
      <div id="profileOrders" class="orders"></div>
    </div>
  </div>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/app.js?v=2"></script>
</body>
</html>
